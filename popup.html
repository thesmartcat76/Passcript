<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassCript</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@700;800&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 320px;
            min-height: 400px;
            background: #0a0a0f;
            color: #e0e0f0;
            font-family: 'Share Tech Mono', monospace;
            padding: 24px 20px;
            overflow: hidden;
        }

        /* Scanline overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,255,180,0.03) 2px,
                rgba(0,255,180,0.03) 4px
            );
            pointer-events: none;
        }

        header {
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(0,255,180,0.2);
            padding-bottom: 14px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #00ffb4;
            text-shadow: 0 0 12px rgba(0,255,180,0.5);
        }

        h1 span { color: #fff; }

        .subtitle {
            font-size: 10px;
            letter-spacing: 0.25em;
            color: rgba(0,255,180,0.5);
            text-transform: uppercase;
            margin-top: 3px;
        }

        label {
            display: block;
            font-size: 11px;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: rgba(0,255,180,0.04);
            border: 1px solid rgba(0,255,180,0.2);
            border-radius: 4px;
            color: #e0e0f0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            padding: 10px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: rgba(0,255,180,0.6); }

        .btn-row {
            display: flex;
            gap: 8px;
            margin: 14px 0;
        }

        button {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(0,255,180,0.4);
            background: transparent;
            color: #00ffb4;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: rgba(0,255,180,0.1);
            box-shadow: 0 0 10px rgba(0,255,180,0.2);
        }

        button:active { background: rgba(0,255,180,0.2); }

        .output-label { margin-top: 16px; }

        #result {
            width: 100%;
            min-height: 60px;
            background: rgba(0,255,180,0.04);
            border: 1px solid rgba(0,255,180,0.15);
            border-radius: 4px;
            padding: 10px;
            font-size: 13px;
            color: #00ffb4;
            word-break: break-all;
            margin-top: 8px;
            position: relative;
            height: auto;
        }

        #result.empty { color: rgba(255,255,255,0.2); font-style: italic; }

        .copy-btn {
            display: none;
            margin-top: 10px;
            width: 100%;
            color: rgba(255,255,255,0.5);
            border-color: rgba(255,255,255,0.15);
            font-size: 10px;
        }

        .copy-btn:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.05);
            box-shadow: none;
        }

        .copy-btn.visible { display: block; }

        #status {
            font-size: 10px;
            color: rgba(0,255,180,0.6);
            text-align: center;
            height: 16px;
            margin-top: 6px;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Pass<span>Cript</span></h1>
        <p class="subtitle">Atbash cipher · v1.0</p>
    </header>

    <label for="password">Input</label>
    <textarea id="password" placeholder="Type your password..."></textarea>

    <div class="btn-row">
        <button id="encryptBtn">Encrypt</button>
        <button id="decryptBtn">Decrypt</button>
    </div>

    <label class="output-label">Output</label>
    <div id="result" class="empty">Result will appear here...</div>
    <button class="copy-btn" id="copyBtn">⎘ Copy to clipboard</button>
    <p id="status"></p>

    <!-- randoms.js must load first so encrypt/decrypt are defined before popup.js runs -->
    <script src="randoms.js"></script>
    <script src="popup.js"></script>
</body>
</html>
